<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one-screen photo tool. Slim header, full-bleed dark stage holding the canvas, control panel pinned underneath.
   Single committed dark look: an image-editing surface should not change with the host theme. */
:root{
  --bg:#12151a; --stage:#0b0d10; --panel:#191d23; --raised:#232831; --line:#2d333d;
  --fg:#e9edf2; --muted:#8f98a6; --accent:#ffd23f; --accent-ink:#1b1600; --danger:#ff8574;
  --f-display:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.35;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;margin:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{margin:0;font:600 17px/1 var(--f-display);letter-spacing:-.01em;white-space:nowrap}
.tag{padding:3px 8px;border:1px solid var(--line);border-radius:6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.btn{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--raised);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;white-space:nowrap}
.btn:active{background:#2c333e;transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:active{background:#f0c32f}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.sm{min-height:40px}
.btn:focus-visible,.seg button:focus-visible,#view:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{position:relative;flex:1;min-height:0;background:var(--stage);overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none;cursor:grab}
#loupe{position:absolute;left:0;top:0;pointer-events:none;border-radius:50%;box-shadow:0 8px 28px rgba(0,0,0,.55),0 0 0 2px rgba(255,255,255,.85);z-index:3}
.chip{position:absolute;z-index:2;padding:5px 9px;border-radius:8px;background:rgba(14,16,20,.74);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);font-size:12px;font-variant-numeric:tabular-nums;pointer-events:none;max-width:calc(100% - 24px)}
.chip.tl{top:10px;left:max(10px,env(safe-area-inset-left,0px))}
.chip.tr{top:10px;right:max(10px,env(safe-area-inset-right,0px))}
.chip.bl{bottom:10px;left:max(10px,env(safe-area-inset-left,0px))}
.chip.bad{color:var(--danger);border-color:rgba(255,133,116,.45)}
.chip.msg{bottom:10px;left:50%;transform:translateX(-50%);background:rgba(36,40,48,.94);text-align:center}
.busy{position:absolute;inset:0;z-index:6;display:grid;place-content:center;justify-items:center;gap:12px;background:rgba(11,13,16,.72);font-weight:500}
.track{width:200px;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .12s linear}
.result{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:16px;background:var(--stage)}
.result img{max-width:100%;max-height:100%;object-fit:contain;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.55)}
.panel{display:grid;gap:8px;padding-top:10px;padding-bottom:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line)}
.seg{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.seg button{min-height:40px;min-width:0;border:0;border-radius:8px;background:transparent;color:var(--muted);font-weight:500;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg svg{width:14px;height:14px;flex:none}
.row{display:flex;gap:8px;align-items:stretch}
.grow{flex:1;min-width:0}
.sq{width:44px;padding:0;font-size:18px;font-variant-numeric:tabular-nums}
.nudge{display:grid;grid-template-columns:repeat(4,44px);gap:6px}
.nudge .btn{padding:0;font-size:18px}
.note{margin:0;color:var(--muted);font-size:13px;text-align:center}
.note b{color:var(--fg);font-weight:600}
.info{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>

<header class="bar">
  <div class="brand">
    <h1>Perspective Crop</h1>
    <span class="tag" id="sampleTag" hidden>Sample</span>
  </div>
  <button class="btn sm" id="pickBtn" type="button">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="2"/><circle cx="5.6" cy="6.4" r="1.2"/><path d="M2.4 12l3.6-3.4 2.6 2.4 2-1.8 3.2 2.8"/></svg>
    Choose photo
  </button>
  <input type="file" id="file" accept="image/*" hidden>
</header>

<main class="stage" id="stage">
  <canvas id="view" tabindex="0" role="img" aria-label="Photo with four adjustable edges. Drag the rings to align each edge. Arrow keys nudge the selected ring."></canvas>
  <canvas id="loupe" hidden></canvas>
  <div class="chip tl" id="hint">Drag a ring, or slide a whole edge. Pinch to zoom.</div>
  <div class="chip tr" id="zoomTag">×1.0</div>
  <div class="chip bl" id="readout" aria-live="polite"></div>
  <div class="chip msg" id="msg" hidden></div>
  <div class="busy" id="busy" hidden><div id="busyText">Working…</div><div class="track"><div class="fill" id="busyFill"></div></div></div>
  <div class="result" id="result" hidden><img id="resultImg" alt="Cropped result"></div>
</main>

<section class="panel" id="editPanel">
  <div class="seg" id="edgeSeg" role="group" aria-label="Edge to adjust">
    <button type="button" data-edge="0" aria-pressed="true"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" opacity=".4"/><path d="M3 3H13" stroke-width="2.6"/></svg>Top</button>
    <button type="button" data-edge="1" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" opacity=".4"/><path d="M13 3V13" stroke-width="2.6"/></svg>Right</button>
    <button type="button" data-edge="2" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" opacity=".4"/><path d="M3 13H13" stroke-width="2.6"/></svg>Bottom</button>
    <button type="button" data-edge="3" aria-pressed="false"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><rect x="3" y="3" width="10" height="10" opacity=".4"/><path d="M3 3V13" stroke-width="2.6"/></svg>Left</button>
  </div>
  <div class="row">
    <button class="btn sm grow" id="endA" type="button">Left end</button>
    <button class="btn sm grow" id="endB" type="button">Right end</button>
    <button class="btn sm sq" id="zOut" type="button" aria-label="Zoom out">−</button>
    <button class="btn sm sq" id="zIn" type="button" aria-label="Zoom in">+</button>
    <button class="btn sm" id="zFit" type="button">Fit</button>
  </div>
  <div class="row">
    <div class="nudge" role="group" aria-label="Nudge selected ring by one pixel">
      <button class="btn" type="button" data-dx="-1" data-dy="0" aria-label="Nudge left">←</button>
      <button class="btn" type="button" data-dx="1" data-dy="0" aria-label="Nudge right">→</button>
      <button class="btn" type="button" data-dx="0" data-dy="-1" aria-label="Nudge up">↑</button>
      <button class="btn" type="button" data-dx="0" data-dy="1" aria-label="Nudge down">↓</button>
    </div>
    <button class="btn primary grow" id="cropBtn" type="button">Crop</button>
  </div>
</section>

<section class="panel" id="resultPanel" hidden>
  <p class="note"><b>Touch and hold</b> the image, then choose <b>Save to Photos</b>.</p>
  <div class="info"><span id="resDims"></span><span id="resSize"></span></div>
  <div class="seg" id="fmtSeg" style="--n:2" role="group" aria-label="File format">
    <button type="button" data-fmt="jpeg" aria-pressed="true">JPG</button>
    <button type="button" data-fmt="png" aria-pressed="false">PNG</button>
  </div>
  <div class="row">
    <button class="btn grow" id="backBtn" type="button">Back to edit</button>
    <button class="btn primary grow" id="newBtn" type="button">New photo</button>
  </div>
</section>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s);};
var MAXDIM=4096, MAXAREA=16000000, MAXS=16;

/*MATH-START*/
function squareToQuad(q){
  var p0=q[0],p1=q[1],p2=q[2],p3=q[3];
  var dx1=p1.x-p2.x,dx2=p3.x-p2.x,dx3=p0.x-p1.x+p2.x-p3.x;
  var dy1=p1.y-p2.y,dy2=p3.y-p2.y,dy3=p0.y-p1.y+p2.y-p3.y;
  var g=0,h=0;
  if(Math.abs(dx3)>1e-9||Math.abs(dy3)>1e-9){
    var den=dx1*dy2-dy1*dx2;
    if(Math.abs(den)<1e-12) return null;
    g=(dx3*dy2-dy3*dx2)/den;
    h=(dx1*dy3-dy1*dx3)/den;
  }
  return [p1.x-p0.x+g*p1.x, p3.x-p0.x+h*p3.x, p0.x,
          p1.y-p0.y+g*p1.y, p3.y-p0.y+h*p3.y, p0.y,
          g, h, 1];
}
function inv3(m){
  var a=m[0],b=m[1],c=m[2],d=m[3],e=m[4],f=m[5],g=m[6],h=m[7],i=m[8];
  var A=e*i-f*h,B=-(d*i-f*g),C=d*h-e*g;
  var det=a*A+b*B+c*C;
  if(Math.abs(det)<1e-14) return null;
  var k=1/det;
  return [A*k,-(b*i-c*h)*k,(b*f-c*e)*k, B*k,(a*i-c*g)*k,-(a*f-c*d)*k, C*k,-(a*h-b*g)*k,(a*e-b*d)*k];
}
function mul3(A,B){
  var R=new Array(9);
  for(var r=0;r<3;r++)for(var c=0;c<3;c++)R[r*3+c]=A[r*3]*B[c]+A[r*3+1]*B[3+c]+A[r*3+2]*B[6+c];
  return R;
}
function lineX(a1,a2,b1,b2){
  var d1x=a2.x-a1.x,d1y=a2.y-a1.y,d2x=b2.x-b1.x,d2y=b2.y-b1.y;
  var den=d1x*d2y-d1y*d2x;
  if(Math.abs(den)<1e-6) return null;
  var t=((b1.x-a1.x)*d2y-(b1.y-a1.y)*d2x)/den;
  return {x:a1.x+t*d1x,y:a1.y+t*d1y};
}
/*MATH-END*/

/* ---------- Projective warp (inverse mapping, bilinear) ---------- */
/* M maps output pixel coords (x+.5,y+.5) to source pixel coords. */
function warp(sd,sw,sh,ow,oh,M,mode,onp){
  var out=new Uint8ClampedArray(ow*oh*4);
  var m0=M[0],m1=M[1],m2=M[2],m3=M[3],m4=M[4],m5=M[5],m6=M[6],m7=M[7],m8=M[8];
  var transparent=mode==='transparent', maxx=sw-1, maxy=sh-1;
  var rowsPer=Math.max(1,Math.floor(400000/ow));
  var yStart=0;
  return new Promise(function(resolve){
    function step(){
      var yEnd=Math.min(oh,yStart+rowsPer);
      for(var y=yStart;y<yEnd;y++){
        var py=y+0.5, o=y*ow*4;
        for(var x=0;x<ow;x++,o+=4){
          var px=x+0.5;
          var wd=m6*px+m7*py+m8;
          if(wd<1e-9&&wd>-1e-9) continue;
          var iw=1/wd;
          var X=(m0*px+m1*py+m2)*iw, Y=(m3*px+m4*py+m5)*iw;
          var a=255;
          if(transparent){
            var e=Math.min(X,sw-X,Y,sh-Y);
            if(e<=0) continue;
            if(e<1) a=e*255;
          }
          var fx=X-0.5, fy=Y-0.5;
          var x0=Math.floor(fx), y0=Math.floor(fy);
          var tx=fx-x0, ty=fy-y0;
          var x1=x0+1, y1=y0+1;
          if(x0<0)x0=0; else if(x0>maxx)x0=maxx;
          if(x1<0)x1=0; else if(x1>maxx)x1=maxx;
          if(y0<0)y0=0; else if(y0>maxy)y0=maxy;
          if(y1<0)y1=0; else if(y1>maxy)y1=maxy;
          var i00=(y0*sw+x0)*4,i10=(y0*sw+x1)*4,i01=(y1*sw+x0)*4,i11=(y1*sw+x1)*4;
          var w00=(1-tx)*(1-ty),w10=tx*(1-ty),w01=(1-tx)*ty,w11=tx*ty;
          out[o]=sd[i00]*w00+sd[i10]*w10+sd[i01]*w01+sd[i11]*w11;
          out[o+1]=sd[i00+1]*w00+sd[i10+1]*w10+sd[i01+1]*w01+sd[i11+1]*w11;
          out[o+2]=sd[i00+2]*w00+sd[i10+2]*w10+sd[i01+2]*w01+sd[i11+2]*w11;
          out[o+3]=a;
        }
      }
      yStart=yEnd;
      if(onp) onp(yEnd/oh);
      if(yStart<oh) setTimeout(step,0); else resolve(out);
    }
    step();
  });
}

/* ---------- Sample scene (a document photographed at an angle) ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function drawDoc(){
  var c=document.createElement('canvas');c.width=1600;c.height=1000;
  var x=c.getContext('2d');
  x.fillStyle='#f5f7f9';x.fillRect(0,0,1600,1000);
  x.strokeStyle='#d5dce5';x.lineWidth=1;
  var i;
  for(i=60;i<=1540;i+=40){x.beginPath();x.moveTo(i,60);x.lineTo(i,940);x.stroke();}
  for(i=60;i<=940;i+=40){x.beginPath();x.moveTo(60,i);x.lineTo(1540,i);x.stroke();}
  x.strokeStyle='#1f2a37';x.lineWidth=5;x.strokeRect(36,36,1528,928);
  x.lineWidth=1.5;x.strokeRect(50,50,1500,900);
  /* floor plan */
  x.lineWidth=8;x.strokeRect(160,170,820,540);
  x.lineWidth=5;
  x.beginPath();x.moveTo(560,170);x.lineTo(560,450);x.moveTo(160,450);x.lineTo(740,450);x.moveTo(740,450);x.lineTo(740,710);x.stroke();
  x.lineWidth=2;
  x.beginPath();x.arc(560,350,70,Math.PI/2,Math.PI);x.moveTo(560,350);x.lineTo(560,420);x.stroke();
  x.beginPath();x.arc(740,600,70,Math.PI,Math.PI*1.5);x.moveTo(740,600);x.lineTo(670,600);x.stroke();
  x.fillStyle='#1f2a37';x.font='600 26px "Space Grotesk",system-ui,sans-serif';x.textAlign='center';
  x.fillText('LIVING',360,330);x.fillText('KITCHEN',770,330);x.fillText('BEDROOM',450,590);x.fillText('BATH',860,590);
  /* dimension lines */
  x.lineWidth=2;x.strokeStyle='#3b4757';x.font='500 22px system-ui,sans-serif';
  x.beginPath();x.moveTo(160,120);x.lineTo(980,120);x.moveTo(160,106);x.lineTo(160,134);x.moveTo(980,106);x.lineTo(980,134);x.stroke();
  x.fillText('8 200',570,108);
  x.beginPath();x.moveTo(110,170);x.lineTo(110,710);x.moveTo(96,170);x.lineTo(124,170);x.moveTo(96,710);x.lineTo(124,710);x.stroke();
  x.save();x.translate(96,440);x.rotate(-Math.PI/2);x.fillText('5 400',0,0);x.restore();
  /* notes column */
  var r=rng(11);x.fillStyle='#b8c1cc';
  for(i=0;i<13;i++){x.fillRect(1060,170+i*40,260+r()*330,12);}
  x.fillStyle='#1f2a37';x.textAlign='left';x.font='600 26px "Space Grotesk",system-ui,sans-serif';
  x.fillText('GENERAL NOTES',1060,148);
  /* title block */
  x.strokeStyle='#1f2a37';x.lineWidth=4;x.strokeRect(1060,720,460,200);
  x.lineWidth=2;
  x.beginPath();x.moveTo(1060,790);x.lineTo(1520,790);x.moveTo(1060,855);x.lineTo(1520,855);x.moveTo(1290,790);x.lineTo(1290,920);x.stroke();
  x.fillStyle='#1f2a37';x.font='600 30px "Space Grotesk",system-ui,sans-serif';x.fillText('GROUND FLOOR PLAN',1078,764);
  x.font='500 20px system-ui,sans-serif';x.fillStyle='#5a6675';
  x.fillText('SCALE',1078,818);x.fillText('SHEET',1308,818);x.fillText('DRAWN',1078,883);x.fillText('REV',1308,883);
  x.fillStyle='#1f2a37';x.font='600 26px "Space Grotesk",system-ui,sans-serif';
  x.fillText('1:50',1078,844);x.fillText('1 / 1',1308,844);x.fillText('SAMPLE',1078,908);x.fillText('A',1308,908);
  /* light falloff */
  var g=x.createLinearGradient(0,0,1600,1000);g.addColorStop(0,'rgba(255,255,255,.10)');g.addColorStop(1,'rgba(0,0,0,.14)');
  x.fillStyle=g;x.fillRect(0,0,1600,1000);
  return c;
}
function drawDesk(x,w,h){
  var g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,'#4b3729');g.addColorStop(1,'#291d15');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  var r=rng(7),i;
  for(i=0;i<260;i++){
    var y=r()*h,a=0.03+r()*0.07;
    x.strokeStyle=(r()<0.5?'rgba(0,0,0,':'rgba(255,220,180,')+a+')';
    x.lineWidth=0.6+r()*2.2;
    x.beginPath();x.moveTo(0,y+r()*20);
    x.bezierCurveTo(w*0.3,y+r()*40-20,w*0.6,y+r()*40-20,w,y+r()*30-15);x.stroke();
  }
  var v=x.createRadialGradient(w/2,h/2,h*0.3,w/2,h/2,h*0.9);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');
  x.fillStyle=v;x.fillRect(0,0,w,h);
}
function buildSample(){
  var SW=1600,SH=1200;
  var doc=drawDoc();
  var scene=document.createElement('canvas');scene.width=SW;scene.height=SH;
  var sc=scene.getContext('2d');
  drawDesk(sc,SW,SH);
  var q=[{x:240,y:300},{x:1310,y:240},{x:1330,y:950},{x:200,y:970}];
  sc.save();sc.shadowColor='rgba(0,0,0,.6)';sc.shadowBlur=46;sc.shadowOffsetY=20;sc.fillStyle='#222';
  sc.beginPath();sc.moveTo(q[0].x,q[0].y);for(var i=1;i<4;i++)sc.lineTo(q[i].x,q[i].y);sc.closePath();sc.fill();sc.restore();
  var Mq=squareToQuad(q),inv=inv3(Mq);
  var P2=mul3([doc.width,0,0,0,doc.height,0,0,0,1],inv);
  var dd=doc.getContext('2d').getImageData(0,0,doc.width,doc.height);
  return warp(dd.data,doc.width,doc.height,SW,SH,P2,'transparent').then(function(out){
    var tmp=document.createElement('canvas');tmp.width=SW;tmp.height=SH;
    tmp.getContext('2d').putImageData(new ImageData(out,SW,SH),0,0);
    sc.drawImage(tmp,0,0);
    return {canvas:scene,w:SW,h:SH,quad:q};
  });
}

/* ---------- State ---------- */

/* ---------- View ---------- */

/* ---------- Drawing ---------- */

/* ---------- Loupe ---------- */

/* ---------- Selection / UI ---------- */

var msgTimer=0;

/* ---------- Pointer handling ---------- */

/* ---------- Nudge ---------- */

/* ---------- Loading a photo ---------- */
function readImage(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){res({im:im,url:url});};
    im.onerror=function(){URL.revokeObjectURL(url);rej(new Error('decode'));};
    im.src=url;
  });
}
function loadFile(file){

  readImage(file).then(function(r){
    var nw=r.im.naturalWidth,nh=r.im.naturalHeight,k=Math.min(1,MAXDIM/Math.max(nw,nh));
    var cw=Math.max(1,Math.round(nw*k)),ch=Math.max(1,Math.round(nh*k));

    var cx=c.getContext('2d');cx.imageSmoothingQuality='high';cx.drawImage(r.im,0,0,cw,ch);
    URL.revokeObjectURL(r.url);
    src={canvas:c,w:cw,h:ch};
    sampleTag.hidden=true;
    defaultHandles();sel=0;updateUI();fitView();
    setMode('edit');setBusy(false);schedule();
  }).catch(function(){
    setBusy(false);showMsg('That photo could not be opened. Try a JPEG or PNG.',3600);
  });
}

/* ---------- Crop ---------- */

  setTimeout(function(){
    resultCanvas.toBlob(function(b){
      setBusy(false);
      if(!b){resultImg.src=resultCanvas.toDataURL(mime,0.95);$('#resSize').textContent='';return;}
      if(resultURL)URL.revokeObjectURL(resultURL);
      resultURL=URL.createObjectURL(b);resultImg.src=resultURL;
      $('#resSize').textContent=(b.size/1048576).toFixed(1)+' MB';
    },mime,0.95);
  },30);
}
function doCrop(){
  var c=corners();if(!validQuad(c))return;
  var o=outSize(c),w=o.w,h=o.h,tok=++cropTok;
  setBusy(true,'Straightening…');
  setTimeout(function(){
    try{
      var sd=src.canvas.getContext('2d').getImageData(0,0,src.w,src.h);
      var Mq=squareToQuad(c);
      var Pm=mul3(Mq,[1/w,0,0,0,1/h,0,0,0,1]);
      warp(sd.data,src.w,src.h,w,h,Pm,'clamp',function(f){busyFill.style.width=Math.round(f*100)+'%';}).then(function(out){
        if(tok!==cropTok)return;
        var oc=document.createElement('canvas');oc.width=w;oc.height=h;
        oc.getContext('2d').putImageData(new ImageData(out,w,h),0,0);
        resultCanvas=oc;
        $('#resDims').textContent=w+' × '+h+' px';
        setMode('result');
        encodeResult();
      }).catch(function(){setBusy(false);showMsg('Not enough memory to crop. Try a smaller area.',3600);});
    }catch(err){setBusy(false);showMsg('Not enough memory to crop. Try a smaller area.',3600);}
  },40);
}

/* ---------- Start ---------- */
updateUI();
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
window.addEventListener('resize',resize);
resize();
buildSample().then(function(s){
  if(src)return;
  src={canvas:s.canvas,w:s.w,h:s.h};
  setFromQuad(s.quad,[[10,34],[-6,-30],[-34,8],[30,-12],[8,-36],[-12,32],[30,-10],[-28,14]]);
  sampleTag.hidden=false;
  resize();fitView();schedule();
});
})();
</script>
